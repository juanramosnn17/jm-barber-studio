# =====================================================================
# Smoke test E2E de producción · JM Barber Studio (tarea 4.16)
# Corre DESPUÉS de que Vercel publica en producción para confirmar que la app
# quedó funcionando. Vercel no crea "deployments" de GitHub en este proyecto:
# reporta un estado de commit con context "Vercel", así que se escucha el
# evento `status` y solo se corre cuando ese estado es success en main.
# También se puede lanzar a mano desde la pestaña Actions (workflow_dispatch).
# Solo lectura: no inicia sesión ni crea datos.
# =====================================================================
name: E2E producción

on:
  status:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke test contra producción
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.context == 'Vercel' &&
       github.event.state == 'success' &&
       contains(github.event.branches.*.name, 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_BASE_URL: https://jm-barber-studio-delta.vercel.app
      E2E_API_URL: https://jm-barber-api.onrender.com

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Smoke test E2E
        run: npm run test:e2e

      - name: Guardar reporte si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-playwright
          path: |
            playwright-report/
            test-results/
          retention-days: 7
