# =====================================================================
# API JM Barber Studio · Spring Boot 4 (contrato: docs/contratos/api-rest.md)
# Las credenciales NUNCA van aquí: se leen de variables de entorno o del
# archivo backend/.env (ignorado por git; plantilla en backend/.env.example).
# =====================================================================
spring.application.name=jm-barber-api
server.port=${PORT:8080}
spring.config.import=optional:file:.env[.properties]

# Respuestas de error sin trazas internas
server.error.include-stacktrace=never

# --- Base de datos MySQL (tarea 4.2) --------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# El esquema lo maneja Flyway (src/main/resources/db/migration); Hibernate solo valida
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota

# --- Autenticación JWT (tarea 4.3) ---------------------------------------
jwt.secret=${JWT_SECRET}
# Duración de la sesión: 7 días (igual que la cookie de sesión del frontend)
jwt.expiration-hours=168
