# =====================================================================
# API JM Barber Studio · Spring Boot 4 (contrato: docs/contratos/api-rest.md)
# Las credenciales NUNCA van aquí: se leen de variables de entorno.
# =====================================================================
spring.application.name=jm-barber-api
server.port=${PORT:8080}

# Respuestas de error sin trazas internas
server.error.include-stacktrace=never

# --- Tarea 4.1: todavía sin base de datos ---------------------------------
# La conexión a MySQL (DataSource, JPA y Flyway) se activa en la tarea 4.2.
# Esta exclusión se elimina en ese momento.
spring.autoconfigure.exclude=\
  org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,\
  org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration,\
  org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration,\
  org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration
